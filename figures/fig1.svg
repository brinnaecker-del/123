<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="696" viewBox="0 0 1210 696">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
</defs>
<rect width="1210" height="696" fill="#fff"/>
<g font-family="'Noto Serif CJK SC','Noto Serif CJK','SimSun',serif" fill="#111">
<rect x="231" y="15" width="740" height="47" rx="0" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="601" y="46" font-size="22" font-weight="700" text-anchor="middle">新时代党的治藏方略：稳定、发展、生态、强边（四件大事）</text>
<path d="M601,62 L601,80" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="455" y="82" width="293" height="40" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="601.5" y="109" font-size="18" font-weight="700" text-anchor="middle">国家战略功能映射</text>
<path d="M601,122 L601,131" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="122" y="133" width="956" height="137" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="147" y="148" width="301" height="109" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="297.5" y="173" font-size="17" font-weight="700" text-anchor="middle">安全功能（S）</text>
<text x="297.5" y="196" font-size="15" text-anchor="middle">（稳定＋强边）</text>
<text x="297.5" y="222" font-size="14" text-anchor="middle">边疆安全、社会稳定、民族团结、</text>
<text x="297.5" y="244" font-size="14" text-anchor="middle">民生保障、治理效能</text>
<rect x="462" y="148" width="274" height="109" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="599.0" y="173" font-size="17" font-weight="700" text-anchor="middle">发展功能（D）</text>
<text x="599.0" y="196" font-size="15" text-anchor="middle">（发展）</text>
<text x="599.0" y="222" font-size="14" text-anchor="middle">经济增长质量、结构升级、效率提升、</text>
<text x="599.0" y="244" font-size="14" text-anchor="middle">开放合作、共同富裕</text>
<rect x="781" y="148" width="282" height="109" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="922.0" y="173" font-size="17" font-weight="700" text-anchor="middle">生态屏障功能（E）</text>
<text x="922.0" y="196" font-size="15" text-anchor="middle">（生态）</text>
<text x="922.0" y="222" font-size="14" text-anchor="middle">生态安全、资源环境承载、生态保护修复、</text>
<text x="922.0" y="244" font-size="14" text-anchor="middle">绿色低碳发展</text>
<path d="M274,257 L274,296" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M599,257 L599,288" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M922,257 L922,296" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="158" y="298" width="232" height="99" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="274" y="326" font-size="16" font-weight="700" text-anchor="middle">下界约束（底线）</text>
<text x="274" y="352" font-size="15" text-anchor="middle">不可从下击穿</text>
<text x="274" y="379" font-size="15" text-anchor="middle">为发展提供稳定与保障条件</text>
<rect x="500" y="290" width="198" height="121" rx="0" fill="#fff" stroke="#111" stroke-width="2.6"/>
<text x="599" y="316" font-size="17" font-weight="700" text-anchor="middle">发展（D）</text>
<text x="599" y="341" font-size="16" font-weight="700" text-anchor="middle">约束条件下的响应变量</text>
<text x="599" y="368" font-size="15" text-anchor="middle">在底线与边界约束下</text>
<text x="599" y="391" font-size="15" text-anchor="middle">实现能力提升</text>
<rect x="815" y="298" width="214" height="99" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="922" y="326" font-size="16" font-weight="700" text-anchor="middle">上界约束（边界）</text>
<text x="922" y="352" font-size="15" text-anchor="middle">不可从上突破</text>
<text x="922" y="379" font-size="15" text-anchor="middle">约束发展方式与规模</text>
<path d="M390,350 L498,350" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
