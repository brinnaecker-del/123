<path d="M815,350 L700,350" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="757" y="338" font-size="12.5" text-anchor="middle">H2：价值转化机制</text>
<path d="M274,397 L274,435 L922,435 L922,397" fill="none" stroke="#111" stroke-width="1.5"/>
<path d="M599,411 L599,435" fill="none" stroke="#111" stroke-width="1.5"/>
<path d="M599,428 L606,435 L599,442 L592,435 z" fill="#111"/>
<path d="M599,442 L599,463" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="415" y="465" width="370" height="62" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="600" y="491" font-size="17" font-weight="700" text-anchor="middle">三元协调状态（S—D—E）</text>
<text x="600" y="517" font-size="16" text-anchor="middle">整体水平与结构失衡并存</text>
<path d="M600,527 L600,546" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="415" y="548" width="370" height="64" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="600" y="574" font-size="16.5" font-weight="700" text-anchor="middle">弱补偿性聚合：失衡惩罚型协调指数（MPI）</text>
<text x="600" y="601" font-size="16" text-anchor="middle">降低高值维度对失衡的掩盖效应</text>
<path d="M600,612 L600,630" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="415" y="632" width="370" height="58" rx="0" fill="#fff" stroke="#111" stroke-width="1.6"/>
<text x="600" y="656" font-size="17" font-weight="700" text-anchor="middle">相对短板识别与动态转移</text>
<text x="600" y="681" font-size="16" text-anchor="middle">H3：短板动态转移预期（S ⇄ D ⇄ E）</text>
<rect x="95" y="498" width="195" height="172" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="110" y="526" font-size="15" font-weight="700" text-anchor="start">辅助诊断与稳健性支持</text>
<text x="112" y="552" font-size="14" text-anchor="start"><tspan font-family="Noto Sans CJK SC,sans-serif">•</tspan> 结构性贡献缺口</text>
<text x="112" y="574" font-size="14" text-anchor="start"><tspan font-family="Noto Sans CJK SC,sans-serif">•</tspan> 局部敏感性分析</text>
<text x="112" y="596" font-size="14" text-anchor="start"><tspan font-family="Noto Sans CJK SC,sans-serif">•</tspan> 留一法检验</text>
<text x="112" y="618" font-size="14" text-anchor="start"><tspan font-family="Noto Sans CJK SC,sans-serif">•</tspan> 滚动端点稳定性</text>
<text x="112" y="640" font-size="14" text-anchor="start"><tspan font-family="Noto Sans CJK SC,sans-serif">•</tspan> 基准上/下浮动检验</text>
<text x="112" y="662" font-size="14" text-anchor="start"><tspan font-family="Noto Sans CJK SC,sans-serif">•</tspan> 通用范式对照</text>
